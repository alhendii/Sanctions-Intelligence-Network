[build]
  command = "pnpm --filter @workspace/sanctions-intelligence run build"
  publish = "artifacts/sanctions-intelligence/dist/public"

[build.environment]
  BASE_PATH = "/"
  PORT = "4173"
  # Set VITE_API_BASE_URL in Netlify's environment settings to the origin of
  # the separately published API server (for example, https://api.example.com).
  # Keep it unset locally so the Replit preview continues using /api.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200