kind = "web"
previewPath = "/"
title = "Sanctions Intelligence Network"
description = "A source-led OSINT research workspace for searching sanctioned entities, inspecting dossiers, and tracing verified relationships across an expandable network graph."
version = "1.0.0"
id = "artifacts/sanctions-intelligence"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21677

[services.development]
run = "pnpm --filter @workspace/sanctions-intelligence run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sanctions-intelligence", "run", "build" ]
serve = "static"
publicDir = "artifacts/sanctions-intelligence/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21677"
BASE_PATH = "/"
